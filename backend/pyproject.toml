[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Shukhratbekov Boburbek",email = "shukhratbekovb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.143.1,<0.144.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]
include = [
    {path = "src/backend/presentation/api/documentation/content/**/*", format = ["sdist", "wheel"]},
    {path = "src/backend/infrastructure/notifications/templates/**/*", format = ["sdist", "wheel"]},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
required_plugins = ["pytest-asyncio", "pytest-cov"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "unit: tests without external services",
    "integration: component integration tests, including HTTP and persistence",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 91
precision = 2
show_missing = true
skip_empty = true
