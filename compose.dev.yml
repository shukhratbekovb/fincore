name: fincore-dev

# Local dependencies; run the API and outbox worker on the host via Poetry.
# From the repository root:
# docker compose --env-file backend/.env -f compose.dev.yml up -d --wait
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${FINCORE_POSTGRES_PASSWORD:?Set FINCORE_POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fincore -d fincore']
      interval: 2s
      timeout: 3s
      retries: 15
    logging: *logging

  redis:
    image: redis:8-alpine
    container_name: fincore-redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    logging: *logging

volumes:
  # Keep the existing local data when replacing the former per-service files.
  postgres_data:
    name: fincore-database_postgres_data
  redis_data:
    name: fincore-rate-limits_redis_data
